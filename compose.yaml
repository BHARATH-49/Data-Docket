services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: datadocket
      POSTGRES_USER: datadocket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datadocket -d datadocket"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: ["api"]
    environment: &app_env
      DATABASE_URL: postgres://datadocket:${POSTGRES_PASSWORD}@db:5432/datadocket?sslmode=disable
      UPLOAD_DIR: /data/uploads
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker-1:
    build: .
    command: ["worker"]
    environment: *app_env
    volumes:
      - uploads:/data/uploads
    depends_on:
      api:
        condition: service_healthy

  worker-2:
    build: .
    command: ["worker"]
    environment: *app_env
    volumes:
      - uploads:/data/uploads
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
